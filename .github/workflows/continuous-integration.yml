# Continue integratie: bouwt en test het project automatisch op macOS, Linux
# en Windows bij elke push naar main/develop en bij elke PR daarnaartoe.
# Zo is aantoonbaar dat de code op elk platform werkt (en niet alleen
# "op mijn laptop"), en dat een wijziging niets kapotmaakt (regressie).
#
# LEER: GitHub leest elk .yml-bestand in .github/workflows/ en voert het uit
# op een gratis virtuele machine ("runner"). YAML werkt met inspringing:
# twee spaties per niveau, geen tabs.

name: workflows

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# LEER: bij een nieuwe push op dezelfde branch wordt een nog lopende run
# afgebroken, zodat je niet wacht op een verouderde versie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # LEER: fail-fast false = als Windows faalt, draaien macOS en Linux
      # gewoon door. Dan zie je alle problemen tegelijk.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Ninja installeren
        uses: seanmiddleditch/gha-setup-ninja@v5

      # LEER: op Windows moet de Microsoft-compiler (cl.exe) eerst in het pad
      # gezet worden; op macOS en Linux staat de compiler er al.
      - name: MSVC-omgeving (alleen Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configureren
        run: cmake --preset release

      - name: Bouwen
        run: cmake --build --preset release

      - name: Testen
        run: ctest --preset release