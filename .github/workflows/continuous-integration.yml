# Continuous integration: builds and tests the project on macOS, Linux and
# Windows on every push to main/develop and on every pull request targeting
# them. This demonstrates the code works on all platforms (not only "on my
# laptop") and that a change does not break existing behaviour (regression).
#
# LEARN: GitHub runs every .yml file in .github/workflows/ on a free virtual machine (a "runner").
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the other platforms running when one fails, so all problems
      # are visible in a single run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # On Windows the MSVC compiler (cl.exe) has to be put on the PATH first.
      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release