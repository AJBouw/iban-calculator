# Continuous integration: builds and tests the project on macOS, Linux and
# Windows on every push to main/develop and on every pull request targeting
# them, and checks the formatting. This demonstrates the code works on all
# platforms (not only "on my laptop") and that a change does not break
# existing behaviour (regression).
#
# LEARN: GitHub runs every .yml file in .github/workflows/ on a free virtual machine (a "runner").
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep the other platforms running when one fails, so all problems
      # are visible in a single run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # On Windows the MSVC compiler (cl.exe) has to be put on the PATH first.
      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  format-check:
    name: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Same pinned version as IBAN_CLANG_FORMAT_VERSION in CMakeLists.txt.
      - name: Install clang-format 21.1.8
        run: pipx install clang-format==21.1.8

      # Tests are not needed to check formatting, so GoogleTest is not downloaded.
      - name: Configure
        run: cmake --preset debug -DIBAN_BUILD_TESTS=OFF

      - name: Check formatting
        run: cmake --build --preset debug --target format-check

  # Builds the benchmark and runs every thread count once, so a change that
  # breaks it is noticed. Timings on shared CI runners vary too much to draw
  # conclusions; measurements are taken locally (docs/measurements.md).
  benchmark-smoke:
    name: benchmark (smoke run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset release -DIBAN_BUILD_TESTS=OFF -DIBAN_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build --preset release --target iban_benchmark
      - name: Run once per thread count
        run: >
          ./build/release/iban_benchmark
          --benchmark_min_time=1x
          --benchmark_out=benchmark.json
          --benchmark_out_format=json
      # The table and the chart appear on the Summary page of the run.
      # GitHub renders Mermaid there, so no image has to be stored.
      - name: Show the results on the run page
        run: |
          cpus=$(jq -r '.context.num_cpus' benchmark.json)
          # One line per thread count: threads, time, speedup, ideal speedup.
          rows=$(jq -r --argjson cpus "$cpus" '
            [.benchmarks[] | select(.run_type == "iteration")] as $runs
            | ($runs[0].real_time) as $base
            | $runs[]
            | (.name | split("/")[1] | tonumber) as $threads
            | [$threads, ((.real_time * 10 | round) / 10),
               (($base / .real_time * 100 | round) / 100),
               ([$threads, $cpus] | min)] | @tsv' benchmark.json)
          {
            echo "### Benchmark (smoke run, indicative only)"
            echo ""
            echo "Runner CPUs: ${cpus}. Shared CI runner: timings vary between runs; see docs/measurements.md for the measurements."
            echo ""
            echo "| Threads | Real time (ms) | Speedup |"
            echo "|---:|---:|---:|"
            awk -F'\t' '{ printf "| %s | %s | %.2f |\n", $1, $2, $3 }' <<< "$rows"
            echo ""
            echo '```mermaid'
            echo 'xychart-beta'
            echo '    title "Speedup on the CI runner"'
            echo "    x-axis \"threads\" [$(cut -f1 <<< "$rows" | paste -sd, -)]"
            echo "    y-axis \"speedup\" 0 --> $(( cpus + 1 ))"
            echo "    line [$(cut -f3 <<< "$rows" | paste -sd, -)]"
            echo "    line [$(cut -f4 <<< "$rows" | paste -sd, -)]"
            echo '```'
            echo ""
            echo "**Legend:** first line = measured speedup; second line = ideal speedup (threads, at most ${cpus} CPUs)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the output
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ubuntu
          path: benchmark.json

  # Runs the Cucumber scenarios against a Release build of the program and keeps
  # the HTML report. Linux only: the scenarios test behaviour, which the
  # build-and-test jobs already check on all three platforms.
  e2e-tests:
    name: end-to-end tests (Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@v6
      # Java 25 for the step definitions; the Maven cache avoids downloading
      # Cucumber and JUnit on every run.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: tests/e2e/pom.xml
      - name: Configure
        run: cmake --preset release -DIBAN_BUILD_TESTS=OFF -DIBAN_BUILD_E2E_TESTS=ON
      - name: Build the program
        run: cmake --build --preset release --target iban
      - name: Run the scenarios
        run: ctest --preset release -L e2e
      # Also kept when a scenario fails, so the report shows which one.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: tests/e2e/target/cucumber-report.html
